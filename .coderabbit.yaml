# CodeRabbit AI 리뷰 설정. 팀 규칙상 참고용이고 사람 리뷰(팀원 1명 승인)를 대신하지 않는다
language: ko-KR
reviews:
  profile: chill                   # 사소한 지적은 줄이고 중요한 것 위주
  request_changes_workflow: false  # 합치기를 막지 않는다 (참고용)
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - develop
      - main
  path_instructions:
    - path: "firmware/**/*.ino"
      instructions: >-
        Arduino Uno(ATmega328P, SRAM 2KB) 펌웨어다. 메모리 사용(String 남용), delay로 인한 입력 누락,
        시리얼 JSON 형식이 gateway.py와 맞는지 위주로 봐 줘.
    - path: "gateway/**/*.py"
      instructions: >-
        우노와 서버 사이 중계다. 서버 응답이 없을 때 안전하게 거부하는지, 재전송 시 eventId가 그대로인지,
        출입 확인 요청 형식(eventId, roomId, deviceId, code)이 core API와 맞는지 위주로 봐 줘.
chat:
  auto_reply: true
