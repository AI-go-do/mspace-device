# PR마다 자동 확인
#  - test: 게이트웨이 테스트 + 커버리지
#  - firmware: 우노 펌웨어가 컴파일되는지
#  - sonar: 학교 SonarQube 서버 분석. develop은 결과 표시만, main으로 가는 PR은 품질 게이트(새 코드 커버리지 80% 이상) 통과해야 성공
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:  # Actions 탭에서 손으로 돌려 보기 (SonarQube 연결 확인용)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements-dev.txt
      - run: pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arduino-cli로 직접 컴파일한다 (젯슨에서 올릴 때와 같은 도구)
      - name: arduino-cli 설치
        run: |
          mkdir -p $HOME/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: 우노 지원·Keypad 설치
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Keypad
      - name: 컴파일
        run: arduino-cli compile -b arduino:avr:uno firmware/uno_sensor_node

  # 학교 SonarQube 서버로 분석 (mspace-assistant와 같은 방식)
  # Community 판은 PR·브랜치 분석이 없어서
  #  - develop·main에 합쳐질 때, 손으로 돌릴 때: 분석만 (대시보드 갱신)
  #  - main으로 가는 PR: 분석 + 품질 게이트(새 코드 커버리지 80%)를 기다려 실패하면 이 확인도 실패
  # SONAR_TOKEN이 아직 없으면(설정 전) 건너뛴다
  sonar:
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: SONAR_TOKEN 확인
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN이 아직 없어서 SonarQube 분석을 건너뛰어요."
      - name: 학교 SonarQube 서버 연결 확인
        if: env.SONAR_HOST_URL != ''
        run: |
          if curl -sS -m 10 "$SONAR_HOST_URL/api/system/status"; then
            echo ""; echo "서버 연결 OK"
          else
            echo "::warning::GitHub 러너에서 $SONAR_HOST_URL 에 연결할 수 없어요 (학교 망 안에서만 열리는 서버일 수 있음)"
          fi
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.base_ref == 'main')
        with:
          fetch-depth: 0  # SonarQube가 "새 코드"를 구분하려면 전체 기록이 필요하다
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.base_ref == 'main')
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@v5
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.base_ref == 'main')
        with:
          args: >
            -Dsonar.qualitygate.wait=${{ github.base_ref == 'main' }}
            -Dsonar.qualitygate.timeout=300
