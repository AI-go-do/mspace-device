# PR마다 자동 확인
#  - test: 게이트웨이 테스트 + 커버리지
#  - firmware: 우노 펌웨어가 컴파일되는지
#  - firmware-esp32: ESP32 펌웨어가 컴파일되는지 (키패드 켬·끔 둘 다)
#  - sonar: 학교 SonarQube 서버 분석. develop은 결과 표시만, main으로 가는 PR은 품질 게이트(새 코드 커버리지 80% 이상) 통과해야 성공
name: CI

permissions:
  contents: read  # 읽기만 한다 (쓰기 권한이 필요 없다)

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:  # Actions 탭에서 손으로 돌려 보기 (SonarQube 연결 확인용)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # 토큰을 디스크에 남기지 않는다
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements-dev.txt
      - run: pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # 뒤에서 외부 설치 스크립트를 실행하므로 토큰을 남기지 않는다
      # arduino-cli로 직접 컴파일한다 (젯슨에서 올릴 때와 같은 도구)
      - name: arduino-cli 설치
        run: |
          mkdir -p $HOME/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: 우노 지원·Keypad 설치
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Keypad
      - name: 컴파일
        run: arduino-cli compile -b arduino:avr:uno firmware/uno_sensor_node

  # ESP32 방 장치(2번 방)가 컴파일되는지. 키패드를 켠 것(USE_KEYPAD 1)과 끈 것(0) 둘 다 확인한다
  firmware-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: arduino-cli 설치
        run: |
          mkdir -p $HOME/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: ESP32 지원·Keypad 설치
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install Keypad
      - name: 컴파일 (키패드 켬)
        run: arduino-cli compile -b esp32:esp32:esp32 firmware/esp32_room_node
      - name: 컴파일 (키패드 끔)
        run: |
          sed -i 's/^#define USE_KEYPAD 1/#define USE_KEYPAD 0/' firmware/esp32_room_node/config.h
          grep -q '^#define USE_KEYPAD 0' firmware/esp32_room_node/config.h
          arduino-cli compile -b esp32:esp32:esp32 firmware/esp32_room_node

  # 학교 SonarQube 서버로 분석 (mspace-assistant와 같은 방식)
  # Community 판은 PR·브랜치 분석이 없어서
  #  - develop·main에 합쳐질 때, 손으로 돌릴 때: 분석만 (대시보드 갱신)
  #  - main으로 가는 PR: 분석 + 품질 게이트(새 코드 커버리지 80%)를 기다려 실패하면 이 확인도 실패
  # SONAR_TOKEN이 아직 없으면(설정 전) 건너뛴다
  sonar:
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: SONAR_TOKEN 확인
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN이 아직 없어서 SonarQube 분석을 건너뛰어요."
      - name: 학교 SonarQube 서버 연결 확인
        if: env.SONAR_HOST_URL != ''
        run: |
          if curl -sS -m 10 "$SONAR_HOST_URL/api/system/status"; then
            echo ""; echo "서버 연결 OK"
          else
            echo "::warning::GitHub 러너에서 $SONAR_HOST_URL 에 연결할 수 없어요 (학교 망 안에서만 열리는 서버일 수 있음)"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.base_ref == 'main')
        with:
          persist-credentials: false
          fetch-depth: 0  # SonarQube가 "새 코드"를 구분하려면 전체 기록이 필요하다
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.base_ref == 'main')
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.base_ref == 'main')
        with:
          args: >
            -Dsonar.qualitygate.wait=${{ github.base_ref == 'main' }}
            -Dsonar.qualitygate.timeout=300
