<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-label="우노 센서 노드 회로도" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/>
    <style>
      .s{fill:none;stroke:#1d2a26;stroke-width:2}
      .st{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;fill:#1d2a26}
      .sm{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#1d2a26}
      .sb{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;font-weight:700;fill:#1d2a26}
      .net{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:500}
    </style>
    <!-- 우노 -->
    <rect x="300" y="30" width="160" height="470" rx="6" fill="none" stroke="#0f6e73" stroke-width="2.5"/>
    <text class="sb" x="380" y="270" text-anchor="middle" style="fill:#0f6e73">Arduino</text>
    <text class="sb" x="380" y="288" text-anchor="middle" style="fill:#0f6e73">UNO</text>
    <g class="sm">
      <text x="308" y="64">D13</text><text x="308" y="100">D12</text><text x="308" y="136">D11</text><text x="308" y="172">D10</text><text x="308" y="208">D9</text><text x="308" y="244">D8</text><text x="308" y="280">D7</text><text x="308" y="316">D6</text><text x="308" y="352">D5</text><text x="308" y="388">D4</text><text x="308" y="424">D3</text><text x="308" y="460">D2</text>
      <text x="452" y="124" text-anchor="end">5V</text><text x="452" y="244" text-anchor="end">A0</text><text x="452" y="364" text-anchor="end">GND</text>
    </g>

    <!-- D13 빨강 LED, D12 초록 LED : 핀 → 저항 → LED → GND -->
    <g>
      <path class="s" d="M300 60 H262 l-4 -7 l-8 14 l-8 -14 l-8 14 l-8 -14 l-8 14 l-4 -7 H196" stroke="#d33a2c"/>
      <path d="M196 50 V70 L176 60 Z" fill="#d33a2c"/><line x1="174" y1="50" x2="174" y2="70" stroke="#d33a2c" stroke-width="2.5"/>
      <path class="s" d="M174 60 H150" stroke="#d33a2c"/>
      <text class="net" x="146" y="64" text-anchor="end" style="fill:#2b3a8a">GND</text>
      <text class="st" x="230" y="44" text-anchor="middle">220Ω</text>
      <text class="st" x="186" y="44" text-anchor="middle" style="fill:#d33a2c">빨강</text>

      <path class="s" d="M300 96 H262 l-4 -7 l-8 14 l-8 -14 l-8 14 l-8 -14 l-8 14 l-4 -7 H196" stroke="#1f9a4c"/>
      <path d="M196 86 V106 L176 96 Z" fill="#1f9a4c"/><line x1="174" y1="86" x2="174" y2="106" stroke="#1f9a4c" stroke-width="2.5"/>
      <path class="s" d="M174 96 H150" stroke="#1f9a4c"/>
      <text class="net" x="146" y="100" text-anchor="end" style="fill:#2b3a8a">GND</text>
      <text class="st" x="186" y="120" text-anchor="middle" style="fill:#1f9a4c">초록</text>
      <text class="st" x="186" y="138" text-anchor="middle" style="fill:#5b6b66">QR 결과 LED</text>
    </g>

    <!-- D11~D4 비움: 키패드는 11/10에 뺌 (입실은 문 앞 카메라 QR) -->
    <text class="st" x="290" y="260" text-anchor="end" style="fill:#5b6b66">D11~D4 비움 (키패드 뺌)</text>

    <!-- D3 비움: 레이더는 ESP32에 단다 (docs/wiring-esp32.png) -->

    <!-- D2 PIR -->
    <rect x="60" y="440" width="120" height="60" rx="6" fill="none" stroke="#7a4fc0" stroke-width="2"/>
    <text class="sb" x="110" y="476" text-anchor="middle">PIR</text>
    <path class="s" d="M180 456 H300" stroke="#7a4fc0"/>
    <text class="sm" x="186" y="450" style="font-size:11px">OUT</text>
    <text class="net" x="66" y="520" style="fill:#d33a2c">VCC→5V</text>
    <text class="net" x="126" y="520" style="fill:#2b3a8a">GND</text>

    <!-- 오른쪽: 5V → CDS → A0 노드 → 10kΩ → GND -->
    <path class="s" d="M460 120 H600 V150" stroke="#d33a2c"/>
    <!-- CDS: 저항 기호 + 빛 화살표 -->
    <path class="s" d="M600 150 l-7 4 l14 8 l-14 8 l14 8 l-14 8 l14 8 l-7 4 V230" stroke="#0d8fa8"/>
    <path class="s" d="M640 150 l-20 14 M640 168 l-20 14" stroke="#0d8fa8"/>
    <path d="M620 164 l2 -7 l4 5 Z M620 182 l2 -7 l4 5 Z" fill="#0d8fa8"/>
    <text class="st" x="650" y="182">CDS (빛)</text>
    <path class="s" d="M460 240 H600" stroke="#0d8fa8"/><circle cx="600" cy="240" r="4" fill="#0d8fa8"/>
    <path class="s" d="M600 230 V250" stroke="#0d8fa8"/>
    <path class="s" d="M600 250 V262 l-7 4 l14 8 l-14 8 l14 8 l-14 8 l14 8 l-7 4 V360" stroke="#2b3a8a"/>
    <text class="st" x="616" y="296">10kΩ</text>
    <path class="s" d="M460 360 H600" stroke="#2b3a8a"/><circle cx="600" cy="360" r="4" fill="#2b3a8a"/>
    <path class="s" d="M600 360 V384 M584 384 H616 M590 392 H610 M596 400 H604" stroke="#2b3a8a"/>
    <text class="st" x="624" y="244">A0에서 밝기를 읽음</text>
    <text class="net" x="506" y="114" style="fill:#d33a2c">5V</text>
    <text class="net" x="506" y="354" style="fill:#2b3a8a">GND</text>
  </svg>