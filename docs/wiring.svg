<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-label="우노와 LED, PIR, 조도 센서 배선도" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .t{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;fill:#1d2a26}
    .tm{font-family:ui-monospace,Menlo,monospace;font-size:11px;fill:#e6f4f3}
    .tl{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;font-weight:700;fill:#1d2a26}
    .w{fill:none;stroke-width:2.4;stroke-linejoin:round}
  </style>
  <!-- 브레드보드 전원 줄 -->
  <line x1="20" y1="450" x2="790" y2="450" stroke="#d33a2c" stroke-width="3"/>
  <line x1="20" y1="466" x2="790" y2="466" stroke="#2b3a8a" stroke-width="3"/>
  <text class="t" x="310" y="444" style="fill:#d33a2c">브레드보드 + 줄 (5V)</text>
  <text class="t" x="310" y="482" style="fill:#2b3a8a">브레드보드 − 줄 (GND)</text>

  <!-- 우노 보드 -->
  <rect x="40" y="220" width="400" height="200" rx="10" fill="#0f6e73"/>
  <text x="240" y="330" text-anchor="middle" style="font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:22px;font-weight:700;fill:#e6f4f3">Arduino UNO</text>
  <text x="240" y="352" text-anchor="middle" class="tm">USB로 노트북 연결 (시리얼 115200)</text>
  <g>
    <!-- 디지털 핀 D13..D2 : x = 70 + 30k -->
    <g class="tm" text-anchor="middle">
      <text x="70" y="245">13</text><text x="100" y="245">12</text><text x="130" y="245">11</text><text x="160" y="245">10</text><text x="190" y="245">9</text><text x="220" y="245">8</text><text x="250" y="245">7</text><text x="280" y="245">6</text><text x="310" y="245">5</text><text x="340" y="245">4</text><text x="370" y="245">3</text><text x="400" y="245">2</text>
    </g>
    <text class="tm" x="235" y="265" text-anchor="middle">디지털 핀 (D)</text>
    <g fill="#e6f4f3">
      <circle cx="70" cy="220" r="4"/><circle cx="100" cy="220" r="4"/><circle cx="130" cy="220" r="4"/><circle cx="160" cy="220" r="4"/><circle cx="190" cy="220" r="4"/><circle cx="220" cy="220" r="4"/><circle cx="250" cy="220" r="4"/><circle cx="280" cy="220" r="4"/><circle cx="310" cy="220" r="4"/><circle cx="340" cy="220" r="4"/><circle cx="370" cy="220" r="4"/><circle cx="400" cy="220" r="4"/>
      <circle cx="150" cy="420" r="4"/><circle cx="180" cy="420" r="4"/><circle cx="300" cy="420" r="4"/>
    </g>
    <g class="tm" text-anchor="middle"><text x="150" y="408">5V</text><text x="180" y="408">GND</text><text x="300" y="408">A0</text></g>
    <text class="tm" x="370" y="262" text-anchor="middle">(비움)</text>
  </g>

  <!-- 전원 핀 → 줄 -->
  <path class="w" d="M150 420 V450" stroke="#d33a2c"/><circle cx="150" cy="450" r="4" fill="#d33a2c"/>
  <path class="w" d="M180 420 V466" stroke="#2b3a8a"/><circle cx="180" cy="466" r="4" fill="#2b3a8a"/>

  <!-- D11~D4는 비움 (키패드는 11/10에 뺌, 입실은 문 앞 카메라 QR) -->
  <text class="tm" x="235" y="282" text-anchor="middle">D11~D4 비움 (키패드 뺌)</text>

  <!-- LED 2개 : D13 빨강, D12 초록 -->
  <g>
    <path class="w" d="M70 220 V180" stroke="#d33a2c"/>
    <rect x="62" y="150" width="16" height="30" rx="3" fill="#ffffff" stroke="#d33a2c" stroke-width="2"/>
    <path class="w" d="M70 150 V128" stroke="#d33a2c"/>
    <path d="M60 128 H80 L70 110 Z" fill="#d33a2c"/><line x1="60" y1="108" x2="80" y2="108" stroke="#d33a2c" stroke-width="2.4"/>
    <path class="w" d="M100 220 V180" stroke="#1f9a4c"/>
    <rect x="92" y="150" width="16" height="30" rx="3" fill="#ffffff" stroke="#1f9a4c" stroke-width="2"/>
    <path class="w" d="M100 150 V128" stroke="#1f9a4c"/>
    <path d="M90 128 H110 L100 110 Z" fill="#1f9a4c"/><line x1="90" y1="108" x2="110" y2="108" stroke="#1f9a4c" stroke-width="2.4"/>
    <!-- 캐소드 → GND -->
    <path class="w" d="M70 108 V70 M100 108 V70 M100 70 H22 V466" stroke="#2b3a8a"/>
    <circle cx="70" cy="70" r="3.5" fill="#2b3a8a"/><circle cx="22" cy="466" r="4" fill="#2b3a8a"/>
    <text class="t" x="118" y="170">220Ω</text>
    <text class="t" x="118" y="124">LED 긴 다리(+) 아래쪽</text>
    <text class="t" x="118" y="140" style="fill:#5b6b66">짧은 다리(−) 위 → GND</text>
    <text class="tl" x="34" y="62">LED 빨강 D13 · 초록 D12 (QR 결과)</text>
  </g>

  <!-- PIR : OUT ← D2 -->
  <rect x="560" y="510" width="170" height="80" rx="8" fill="none" stroke="#7a4fc0" stroke-width="2"/>
  <text class="tl" x="645" y="560" text-anchor="middle">PIR (SR501)</text>
  <g class="t" text-anchor="middle" style="font-size:11px"><text x="590" y="528">VCC</text><text x="640" y="528">OUT</text><text x="690" y="528">GND</text></g>
  <path class="w" d="M400 220 V212 H760 V495 H640 V510" stroke="#7a4fc0"/>
  <path class="w" d="M590 450 V510" stroke="#d33a2c"/><circle cx="590" cy="450" r="4" fill="#d33a2c"/>
  <path class="w" d="M690 466 V510" stroke="#2b3a8a"/><circle cx="690" cy="466" r="4" fill="#2b3a8a"/>
  <text class="t" x="566" y="606" style="fill:#5b6b66">핀 이름은 뒷면 확인 (제품마다 순서 다름)</text>

  <!-- 조도(CDS) 분압 : 5V → CDS → 노드(A0) → 10kΩ → GND -->
  <path class="w" d="M220 450 V500" stroke="#d33a2c"/><circle cx="220" cy="450" r="4" fill="#d33a2c"/>
  <rect x="204" y="500" width="32" height="30" rx="14" fill="#ffffff" stroke="#0d8fa8" stroke-width="2"/>
  <text class="t" x="246" y="520">CDS</text>
  <path class="w" d="M220 530 V550" stroke="#0d8fa8"/>
  <circle cx="220" cy="550" r="4" fill="#0d8fa8"/>
  <path class="w" d="M300 420 V550 H220" stroke="#0d8fa8"/>
  <rect x="212" y="560" width="16" height="30" rx="3" fill="#ffffff" stroke="#2b3a8a" stroke-width="2"/>
  <path class="w" d="M220 550 V560" stroke="#0d8fa8"/>
  <path class="w" d="M220 590 V604 H60 V466" stroke="#2b3a8a"/><circle cx="60" cy="466" r="4" fill="#2b3a8a"/>
  <text class="t" x="236" y="580">10kΩ</text>
  <text class="t" x="310" y="545">A0 (CDS와 10kΩ 사이)</text>
  <text class="tl" x="320" y="590">조도 센서</text>
</svg>