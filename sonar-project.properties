# 학교 SonarQube 서버 설정 (팀 공통: 프로젝트 키 = 저장소 이름)
# 서버 주소(SONAR_HOST_URL)와 토큰(SONAR_TOKEN)은 GitHub Secrets에서 받는다
sonar.projectKey=mspace-device
sonar.projectName=mspace-device

# 분석 대상: 게이트웨이(Python). 펌웨어(.ino)는 CI에서 컴파일로 확인한다
sonar.sources=gateway
sonar.exclusions=gateway/tests/**
sonar.tests=gateway/tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
